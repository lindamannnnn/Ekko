{% extends "base.html" %}
{% block h1 %}找回密码{% endblock %}
{% block sub %}输入注册邮箱，我们将发送重置链接{% endblock %}
{% block content %}
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label for="email">邮箱</label>
    {{ form.email(placeholder="you@example.com") }}
    {{ form.submit(class="btn") }}
  </form>
  <div class="alt"><a href="{{ url_for('auth.login') }}">返回登录</a></div>
{% endblock %}
