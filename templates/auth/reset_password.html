{% extends "base.html" %}
{% block h1 %}重置密码{% endblock %}
{% block sub %}请设置一个新的登录密码{% endblock %}
{% block content %}
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label for="password">新密码</label>
    {{ form.password(placeholder="至少 8 位") }}
    <label for="confirm">确认新密码</label>
    {{ form.confirm(placeholder="再次输入密码") }}
    {{ form.submit(class="btn") }}
  </form>
{% endblock %}
