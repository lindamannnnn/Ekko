<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课评编辑器 · {{ klass.name }} · {{ lesson.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-swiss.css') }}">
</head>
<body>
  <div class="topbar">
    <h1>{{ klass.name }}</h1>
    <span class="meta">课次：{{ lesson.title }} · 类型：{{ klass.type_name_custom or (preset.name if preset else '通用') }}
      {% if lesson.lesson_type == 'trial' %}· <b style="color:var(--warning)">试听课</b>{% endif %}</span>
    <a class="btn btn-ghost" href="{{ url_for('classes.detail', class_id=klass.id) }}">返回班级</a>
    <span class="hint-tag" data-tip="这里每位学生一张卡片：AI 已为你写好初稿，可在文本框里逐份微调；点「生成」让 AI 重写，点「确认」归档，点「请假」标记缺席，点「还原原稿」恢复 AI 初稿。">本页怎么用？</span>
  </div>

  {% if not course_ready %}
  <div class="warn-banner">
    本节课还没有课件，也没有填写班级共享课程内容，暂不能生成课评。
    请先上传本节课课件，或在 <a href="{{ url_for('classes.detail', class_id=klass.id) }}">班级详情页</a> 填写共享课程内容后再生成。
  </div>
  {% endif %}

  <div class="toolbar">
    <button class="btn" id="gen-all" {% if not course_ready %}disabled{% endif %}>一键生成全部</button>
    <button class="btn btn-ghost" id="dedup-btn">同班去重</button>
    <span id="progress"></span>
    <span id="busy"></span>
  </div>

  <div class="list" id="review-list"></div>
  <div id="flash"></div>

  <script>
    window.CLASS_CONF = {
      class_id: "{{ klass.id }}",
      lesson_id: "{{ lesson.id }}",
      students: {
        {%- for s in students -%}
        "{{ s.id }}": "{{ s.name }}"{{ "" if loop.last else "," }}
        {%- endfor -%}
      },
      quick_tags: [
        {%- for t in quick_tags_flat -%}"{{ t }}"{{ "" if loop.last else "," }}{%- endfor -%}
      ]
    };
  </script>
  <script src="{{ url_for('static', filename='js/tour.js') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
