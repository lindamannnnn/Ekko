{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div class="ph-left">
    <h1 class="ph-title">编辑课评</h1>
    <p class="ph-sub">修改 AI 生成的课评内容</p>
  </div>
</div>

<div class="glass-card form-card">
  <form method="POST">
    <div class="form-group">
      <label>课评正文</label>
      <textarea name="content" rows="12" class="form-input" style="line-height:1.8;">{{ review.content or '' }}</textarea>
    </div>
    <button type="submit" class="btn-gradient">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      保存修改
    </button>
  </form>
</div>

{% endblock %}
