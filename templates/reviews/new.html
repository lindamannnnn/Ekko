{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>生成课评 · {{ klass.name }}</h1>
  <p class="muted">课次：{{ lesson.title }}</p>
  <form method="POST">
    <p>为以下 {{ students|length }} 名学生生成课评：</p>
    {% for s in students %}
    <label style="display:block">
      <input type="checkbox" name="student_ids" value="{{ s.id }}" checked> {{ s.name }}
    </label>
    {% endfor %}
    <button type="submit">生成</button>
  </form>
</div>
{% endblock %}
