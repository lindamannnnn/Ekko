{% extends "base.html" %}
{% block head %}
<style>
/* 课前备课专用样式（系统 A base.html 的子样式） */
* { box-sizing: border-box; }
.prep-root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --accent: #ffcc00;
  --accent-ikb: #002fa7;
  --danger: #ff3333;
  --grid: rgba(0,0,0,0.04);
  --font: -apple-system, Helvetica, Arial, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 80px 80px;
  line-height: 1.5;
}
.prep-root a { color: var(--fg); }
.prep-root .card {
  background: var(--bg); border: 2px solid var(--fg);
  padding: 28px;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.08);
}
.prep-root .card-hover { transition: transform .15s, box-shadow .15s; cursor: pointer; text-decoration: none; }
.prep-root .card-hover:hover { transform: translate(-2px,-2px); box-shadow: 10px 10px 0 rgba(0,0,0,0.12); }
.prep-root h1, .prep-root h2, .prep-root h3 { margin: 0 0 12px; letter-spacing: -0.5px; }
.prep-root h1 { font-size: 28px; text-transform: uppercase; }
.prep-root h2 { font-size: 20px; }
.prep-root .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.prep-root label { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 13px; text-transform: uppercase; }
.prep-root input[type=text], .prep-root input[type=email], .prep-root input[type=password], .prep-root input[type=number], .prep-root input[type=file], .prep-root select, .prep-root textarea {
  width: 100%; padding: 10px 12px; border: 2px solid var(--fg); border-radius: 0;
  background: var(--bg); color: var(--fg); font-size: 14px; font-family: var(--font);
}
.prep-root select { cursor: pointer; }
.prep-root textarea { min-height: 140px; resize: vertical; }
.prep-root .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
  text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase;
  transition: background .15s, color .15s;
}
.prep-root .btn:hover { background: var(--fg); color: var(--bg); }
.prep-root .btn-primary { background: var(--accent); border-color: var(--fg); }
.prep-root .btn-primary:hover { background: var(--fg); color: var(--bg); }
.prep-root .btn-danger { border-color: var(--danger); color: var(--danger); }
.prep-root .btn-danger:hover { background: var(--danger); color: #fff; }
.prep-root .row { display: flex; gap: 18px; flex-wrap: wrap; }
.prep-root .row > * { flex: 1; min-width: 200px; }
.prep-root .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.prep-root .flash {
  background: var(--bg); border: 2px solid var(--fg); padding: 12px 16px;
  margin-bottom: 18px; font-weight: 700; font-size: 14px;
}
.prep-root .flash.error { border-color: var(--danger); color: var(--danger); }
.prep-root .flash.success { border-left: 6px solid var(--accent); }
.prep-root .empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* 风格样例 */
.prep-root .style-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 16px; }
.prep-root .style-card {
  border: 2px solid var(--fg); background: var(--bg); cursor: pointer;
  overflow: hidden; transition: transform .15s, box-shadow .15s;
}
.prep-root .style-card:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.12); }
.prep-root .style-thumb {
  width: 100%; height: 150px; border: 0; border-bottom: 2px solid var(--fg);
  background: #f5f5f5; pointer-events: none; overflow: hidden;
}
.prep-root .style-info { padding: 12px; }
.prep-root .style-name { font-weight: 700; font-size: 14px; margin: 0 0 6px; text-transform: uppercase; }
.prep-root .style-desc { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.4; }
@media (max-width: 900px) {
  .prep-root .style-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .prep-root .style-grid { grid-template-columns: 1fr; }
}

/* lightbox */
.prep-root .lightbox {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 40px;
}
.prep-root .lightbox.active { display: flex; }
.prep-root .lightbox iframe {
  width: 80vw; height: 80vh; border: 4px solid #fff; background: #fff;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.prep-root .lightbox-close {
  position: absolute; top: 20px; right: 30px; font-size: 32px; color: #fff;
  cursor: pointer; font-weight: 700; user-select: none;
}

@media (max-width: 640px) {
  .prep-root h1 { font-size: 22px; }
}
{% block prep_extra_css %}{% endblock %}
</style>
{% endblock %}

{% block content %}
<div class="prep-root">
  <div class="container" style="max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px;">
    {% block prep_content %}{% endblock %}
  </div>

  <!-- 风格样例 lightbox -->
  <div class="lightbox" id="styleLightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <iframe id="styleFrame" src=""></iframe>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function openStyleDemo(styleId) {
  document.getElementById('styleFrame').src = "{{ url_for('prep.style_demo', style_id='') }}" + styleId;
  document.getElementById('styleLightbox').classList.add('active');
}
function closeLightbox(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('styleLightbox').classList.remove('active');
  document.getElementById('styleFrame').src = '';
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLightbox(); });
{% block prep_extra_js %}{% endblock %}
</script>
{% endblock %}
