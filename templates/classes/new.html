{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div class="ph-left">
    <h1 class="ph-title">新建班级</h1>
    <p class="ph-sub">创建一个新班级，然后添加学生开始写课评</p>
  </div>
</div>

<div class="glass-card form-card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>班级名称</label>
      <input name="name" required class="form-input" placeholder="例如：舞空1班、钢琴初级A组" value="{{ form_name|default('', true) }}">
    </div>
    <div class="form-group">
      <label>班级类型</label>
      <select name="type_code" required class="form-input">
        <option value="" disabled {% if not form_type %}selected{% endif %}>请选择班级类型</option>
        {% for p in presets %}
        <option value="{{ p.code }}" {% if form_type and p.code == form_type %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn-gradient" style="margin-top:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      创建班级
    </button>
  </form>
</div>

{% endblock %}
