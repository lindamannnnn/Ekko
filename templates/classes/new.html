{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>新建班级</h1>
  <form method="POST">
    <label>班级名称 <input name="name" required></label>
    <label>类型
      <select name="type_code" required>
        {% for p in presets %}<option value="{{ p.code }}">{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">创建</button>
  </form>
</div>
{% endblock %}
